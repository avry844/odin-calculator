<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div class="calculator">

        <div class="screen"><p>Hello</p></div>

        <div class="row789/">
            <button class="seven" id="numButton">7</button>
            <button class="eight" id="numButton">8</button>
            <button class="nine" id="numButton">9</button>
            <button class="divide">/</button>
        </div>
        <div class="row456*">
            <button class="four" id="numButton">4</button>
            <button class="five" id="numButton">5</button>
            <button class="six" id="numButton">6</button>
            <button class="times">*</button>
        </div>
        <div class="row123-">
            <button class="one" id="numButton">1</button>
            <button class="two" id="numButton">2</button>
            <button class="three" id="numButton">3</button>
            <button class="minus">-</button>
        </div>
        <div class="row0c=+">
            <button class="zero" id="numButton">0</button>
            <button class="c">c</button>
            <button class="equals">=</button>
            <button class="plus">+</button>
        </div>

    </div>


</body>
</html>
